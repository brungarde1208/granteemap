  body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column;overflow:hidden}

  header h1{font-family:'DM Serif Display',serif;font-size:21px;color:var(--text);white-space:nowrap}
  .hdiv{width:1px;height:26px;background:var(--border)}
  .stat{font-size:12px;color:var(--muted)}.stat strong{color:var(--text);font-weight:600}
  .controls{padding:9px 32px;display:flex;gap:7px;align-items:center;border-bottom:1px solid var(--border);flex-shrink:0;background:rgba(22,27,38,.9)}
  .clabel{font-size:10px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.8px;margin-right:4px}
  .fb{padding:5px 13px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--muted);font-family:'DM Sans',sans-serif;font-size:12px;font-weight:500;cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:5px}
  .fb:hover{border-color:var(--accent);color:var(--accent)}
  .fb.active{background:var(--accent);border-color:var(--accent);color:#fff}
  .fb[data-filter="TA"].active{background:var(--green);border-color:var(--green)}
  .fb[data-filter="Legislative Action"].active{background:var(--gold);border-color:var(--gold);color:#111}
  .fb[data-filter="Elections"].active{background:var(--red);border-color:var(--red)}
  .fb[data-filter="Coalition-building"].active{background:var(--purple);border-color:var(--purple)}
  .dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
  .main{display:flex;flex:1;overflow:hidden}
  .mapwrap{flex:1;display:flex;flex-direction:column;padding:14px 20px 14px 32px;min-width:0;gap:10px}
  #mapsvg{flex:1;width:100%;min-height:0}
  .state{stroke:#0d1117;stroke-width:.6;cursor:pointer;transition:filter .12s}
  .state:hover{filter:brightness(1.6) drop-shadow(0 0 5px rgba(61,142,248,.6))}
  .state.sel{stroke:#fff;stroke-width:1.8;filter:brightness(1.7)}
  .sborder{fill:none;stroke:#0d1117;stroke-width:.6;pointer-events:none}
  .legend{display:flex;align-items:center;gap:14px;flex-shrink:0}
  .ltitle{font-size:10px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.7px}
  .lbar{width:110px;height:8px;border-radius:4px;background:linear-gradient(to right,#1a3a6b,#1e5ba0,#2879d4,#4f9ef7,#7ab8ff)}
  .llabels{display:flex;justify-content:space-between;width:110px;font-size:9px;color:var(--muted);margin-top:2px}
  .hint{font-size:11px;color:var(--muted);opacity:.6}
  .panel{width:365px;background:var(--surface);border-left:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;flex-shrink:0}
  .ph{padding:16px 20px 13px;border-bottom:1px solid var(--border);background:var(--surface2)}
  .ph h2{font-family:'DM Serif Display',serif;font-size:19px;color:var(--text);display:flex;align-items:center;gap:9px}
  .chip{display:inline-flex;align-items:center;justify-content:center;min-width:21px;height:21px;padding:0 6px;border-radius:11px;background:var(--accent);color:#fff;font-size:11px;font-weight:700;font-family:'DM Sans',sans-serif}
  .ph p{font-size:12px;color:var(--muted);margin-top:3px}
  .pb{flex:1;overflow-y:auto;padding:12px 18px}
  .pb::-webkit-scrollbar{width:4px}.pb::-webkit-scrollbar-track{background:transparent}.pb::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
  .empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:var(--muted);text-align:center;gap:12px;padding:36px 20px}
  .empty svg{opacity:.22}.empty h3{font-size:14px;font-weight:500}.empty p{font-size:12px;line-height:1.65}
  .card{background:var(--surface2);border:1px solid var(--border);border-radius:9px;padding:12px 14px;margin-bottom:9px;transition:border-color .15s,transform .1s;animation:fi .2s ease both}
  @keyframes fi{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
  .card:hover{border-color:rgba(61,142,248,.45);transform:translateX(1px)}
  .ctop{display:flex;align-items:flex-start;justify-content:space-between;gap:7px;margin-bottom:8px}
  .gname{font-weight:600;font-size:14px;color:var(--text);flex:1;line-height:1.3}
  .badges{display:flex;gap:3px;flex-wrap:wrap;justify-content:flex-end;flex-shrink:0}
  .badge{display:inline-block;padding:2px 7px;border-radius:9px;font-size:9px;font-weight:700;white-space:nowrap}
  .bTA{background:rgba(48,205,168,.14);color:var(--green);border:1px solid rgba(48,205,168,.28)}
  .bLeg{background:rgba(240,180,41,.14);color:var(--gold);border:1px solid rgba(240,180,41,.28)}
  .bElec{background:rgba(229,83,83,.14);color:var(--red);border:1px solid rgba(229,83,83,.28)}
  .bCoal{background:rgba(167,139,250,.14);color:var(--purple);border:1px solid rgba(167,139,250,.28)}
  .bsec{display:flex;align-items:flex-start;gap:7px;margin-bottom:7px}
  .blabel{font-size:9px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;white-space:nowrap;padding-top:2px}
  .btags{display:flex;flex-wrap:wrap;gap:3px}
  .btag{background:rgba(61,142,248,.1);border:1px solid rgba(61,142,248,.2);color:var(--accent);font-size:10px;font-weight:500;padding:2px 7px;border-radius:4px}
  .btbd{background:rgba(107,117,153,.1);border:1px solid rgba(107,117,153,.18);color:var(--muted);font-size:10px;font-weight:500;padding:2px 7px;border-radius:4px;font-style:italic}
  .desc{font-size:12px;color:#838dab;line-height:1.65;border-top:1px solid var(--border);padding-top:7px;margin-top:1px}
  #tip{position:fixed;background:var(--surface2);border:1px solid var(--border);color:var(--text);font-family:'DM Sans',sans-serif;font-size:12px;padding:6px 12px;border-radius:7px;pointer-events:none;display:none;z-index:9999;box-shadow:0 4px 20px rgba(0,0,0,.5)}
</style>
</head>

let activeFilter="All",selectedState=null;

const FIPS={
  "01":"Alabama","02":"Alaska","04":"Arizona","05":"Arkansas","06":"California",
  "08":"Colorado","09":"Connecticut","10":"Delaware","12":"Florida","13":"Georgia",
  "15":"Hawaii","16":"Idaho","17":"Illinois","18":"Indiana","19":"Iowa","20":"Kansas",
  "21":"Kentucky","22":"Louisiana","23":"Maine","24":"Maryland","25":"Massachusetts",
  "26":"Michigan","27":"Minnesota","28":"Mississippi","29":"Missouri","30":"Montana",
  "31":"Nebraska","32":"Nevada","33":"New Hampshire","34":"New Jersey","35":"New Mexico",
  "36":"New York","37":"North Carolina","38":"North Dakota","39":"Ohio","40":"Oklahoma",
  "41":"Oregon","42":"Pennsylvania","44":"Rhode Island","45":"South Carolina",
  "46":"South Dakota","47":"Tennessee","48":"Texas","49":"Utah","50":"Vermont",
  "51":"Virginia","53":"Washington","54":"West Virginia","55":"Wisconsin","56":"Wyoming"
};

function mf(d){if(activeFilter==="All")return true;return d.types.some(t=>t===activeFilter)}
function entriesFor(s){return DATA.filter(d=>d.state===s&&mf(d))}
function ugCount(s){return new Set(entriesFor(s).map(d=>d.grantee)).size}

const cScale=d3.scaleSequential().domain([0,10]).interpolator(d3.interpolate("#1a3567","#7ab8ff"));
function stateColor(c){return c===0?"#4a5270":cScale(Math.min(c,10))}

function updateStats(){
  const es=DATA.filter(mf);
  document.getElementById("ts").textContent=new Set(es.map(d=>d.state)).size;
  document.getElementById("te").textContent=es.length;
}

function renderPanel(s){
  const es=entriesFor(s);
  const uc=new Set(es.map(d=>d.grantee)).size;
  document.getElementById("ptitle").innerHTML=`${s} <span class="chip">${es.length}</span>`;
  document.getElementById("psub").textContent=`${uc} unique grantee${uc!==1?"s":""} · ${activeFilter==="All"?"all activities":activeFilter}`;
  const pb=document.getElementById("pb");
  if(!es.length){
    pb.innerHTML=`<div class="empty"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#6b7599" stroke-width="1.1"><circle cx="12" cy="12" r="10"/><path d="M12 8v4m0 4h.01"/></svg><h3>No matches</h3><p>No grantees in ${s} match the current filter.</p></div>`;
    return;
  }
  pb.innerHTML=es.map((e,i)=>{
    const bHTML=e.types.map(t=>{
      const cls=t==="TA"?"bTA":t==="Legislative Action"?"bLeg":t==="Elections"?"bElec":"bCoal";
      const lbl=t==="TA"?"TA":t==="Legislative Action"?"Legislative":t==="Elections"?"Elections":"Coalition";
      return `<span class="badge ${cls}">${lbl}</span>`;
    }).join("");
    let billH="";
    const b=e.bills;
    if(b&&b!=="N/A"&&b!==""){
      if(b==="TBD"){
        billH=`<div class="bsec"><span class="blabel">Bills</span><div class="btags"><span class="btbd">TBD</span></div></div>`;
      } else {
        const tags=b.split(",").map(s=>s.trim()).filter(Boolean);
        billH=`<div class="bsec"><span class="blabel">Bills</span><div class="btags">${tags.map(t=>`<span class="btag">${t}</span>`).join("")}</div></div>`;
      }
    }
    const dH=e.desc?`<div class="desc">${e.desc}</div>`:"";
    return `<div class="card" style="animation-delay:${i*.04}s"><div class="ctop"><div class="gname">${e.grantee}</div><div class="badges">${bHTML}</div></div>${billH}${dH}</div>`;
  }).join("");
}

// Map
const svgEl=document.getElementById("mapsvg");
const tip=document.getElementById("tip");
let _redraw=null;

fetch("https://cdn.jsdelivr.net/npm/us-atlas@3/states-10m.json")
  .then(r=>r.json())
  .then(us=>{
    const states=topojson.feature(us,us.objects.states);
    const mesh=topojson.mesh(us,us.objects.states,(a,b)=>a!==b);
    const svg=d3.select("#mapsvg");
    const projection=d3.geoAlbersUsa();
    const path=d3.geoPath().projection(projection);

    function redraw(){
      const w=svgEl.clientWidth,h=svgEl.clientHeight;
      if(!w||!h)return;
      projection.fitSize([w,h],states);
      svg.selectAll(".state,.sborder").remove();
      svg.selectAll(".state")
        .data(states.features).enter().append("path")
        .attr("class","state")
        .attr("d",path)
        .attr("fill",d=>{const n=FIPS[d.id];return n?stateColor(ugCount(n)):"#4a5270"})
        .attr("opacity",1)
        .classed("sel",d=>FIPS[d.id]===selectedState)
        .on("click",(ev,d)=>{
          const n=FIPS[d.id];if(!n)return;
          selectedState=n;redraw();renderPanel(n);
        })
        .on("mouseenter",(ev,d)=>{
          const n=FIPS[d.id];if(!n)return;
          const grantees=[...new Set(entriesFor(n).map(e=>e.grantee))];
          tip.style.display="block";
          if(grantees.length===0){
            tip.innerHTML=`<strong>${n}</strong><span style="color:#6b7599;margin-left:8px">No grantees</span>`;
          } else {
            tip.innerHTML=`<strong style="display:block;margin-bottom:5px">${n}</strong>`+grantees.map(g=>`<span style="display:block;font-size:11px;color:#b0bacc">· ${g}</span>`).join("");
          }
        })
        .on("mousemove",ev=>{tip.style.left=(ev.clientX+14)+"px";tip.style.top=(ev.clientY-36)+"px"})
        .on("mouseleave",()=>{tip.style.display="none"});
      svg.append("path").datum(mesh).attr("class","sborder").attr("d",path);
    }
    _redraw=redraw;
    redraw();
    const ro=new ResizeObserver(()=>redraw());
    ro.observe(svgEl);
  })
  .catch(()=>{
    d3.select("#mapsvg").append("text")
      .attr("x","50%").attr("y","50%").attr("text-anchor","middle")
      .attr("fill","#6b7599").attr("font-family","DM Sans").attr("font-size","14")
      .text("Unable to load map — please check your internet connection.");
  });

document.querySelectorAll(".fb").forEach(btn=>{
  btn.addEventListener("click",()=>{
    document.querySelectorAll(".fb").forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");
    activeFilter=btn.dataset.filter;
    updateStats();
    if(_redraw)_redraw();
    if(selectedState)renderPanel(selectedState);
  });
});

updateStats();
